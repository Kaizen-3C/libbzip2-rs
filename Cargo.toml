[package]
name = "bzip2-safe-rs"
version = "0.1.0"
edition = "2021"
description = "bzip2 1.0.8 codec, C -> idiomatic safe Rust (#![forbid(unsafe_code)]), proven byte-identical to the C reference. One Rust module per upstream C file."
license = "bzip2-1.0.6"

[lib]
name = "bzip2_safe_rs"
path = "src/lib.rs"

[[bin]]
name = "rdp"
path = "src/main.rs"

[profile.release]
opt-level = 2
